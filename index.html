<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manitos de la Mater</title>
<meta http-equiv="refresh" content="0; url=https://manitos-de-la-mater.vercel.app/">
<link rel="canonical" href="https://manitos-de-la-mater.vercel.app/">
<style>
  body{font-family:system-ui,sans-serif;background:#f6f1e4;color:#25507e;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .b{max-width:360px}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#5a6b7d;font-size:15px;line-height:1.5}
  a.btn{display:inline-block;margin-top:16px;background:#25507e;color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:12px}
</style>
</head>
<body>
  <div class="b">
    <h1>Esta version ya no se usa</h1>
    <p>Manitos de la Mater se mudo a una version nueva y mas segura. Te estamos llevando alla.</p>
    <a class="btn" href="https://manitos-de-la-mater.vercel.app/">Entrar a la app nueva</a>
  </div>
  <script>
    try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}); } }catch(e){}
    try{ if(window.caches){ caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});}); } }catch(e){}
    location.replace('https://manitos-de-la-mater.vercel.app/');
  </script>
</body>
</html>
